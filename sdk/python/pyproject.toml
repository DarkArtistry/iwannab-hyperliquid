[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypercore-sdk"
version = "0.1.0"
description = "Python SDK for HyperCore perpetual exchange"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "HyperCore Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
    "websockets>=12.0",
    "eth-account>=0.10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/DarkArtistry/iwannab-hyperliquid"
Documentation = "https://docs.hypercore.xyz"
Repository = "https://github.com/DarkArtistry/iwannab-hyperliquid"

[tool.hatch.build.targets.wheel]
packages = ["hypercore"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
