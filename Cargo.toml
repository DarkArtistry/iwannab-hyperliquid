[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/engine",
    "crates/chain",
    "crates/evm",
    "crates/gateway",
    "crates/indexer",
    "crates/node",
    "crates/persistence",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DarkArtistry/iwannab-hyperliquid"
authors = ["Your Team"]

[workspace.dependencies]
# Internal crates
hypercore-primitives = { path = "crates/primitives" }
hypercore-engine = { path = "crates/engine" }
hypercore-chain = { path = "crates/chain" }
hypercore-evm = { path = "crates/evm" }
hypercore-gateway = { path = "crates/gateway" }
hypercore-indexer = { path = "crates/indexer" }
hypercore-persistence = { path = "crates/persistence" }

# Storage
rocksdb = "0.22"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# EVM
revm = { version = "19.0", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "0.6", features = ["serde"] }
alloy-sol-types = "0.6"
alloy-rlp = "0.3"

# Crypto
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
hex = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# HTTP/WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["json"] }

# JSON-RPC
jsonrpsee = { version = "0.21", features = ["server", "macros"] }

# Consensus (CometBFT ABCI)
tendermint = "0.35"
tendermint-abci = "0.35"
tendermint-proto = "0.35"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Rate limiting
governor = "0.6"

# Utilities
bytes = "1.5"
parking_lot = "0.12"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }
num-traits = "0.2"

# Testing
proptest = "1.4"
criterion = "0.5"
rstest = "0.18"
mockall = "0.12"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
