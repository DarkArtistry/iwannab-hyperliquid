[package]
name = "hypercore-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hypercore"
path = "src/main.rs"

[features]
default = []
cometbft = ["hypercore-chain/cometbft"]
persistence = ["hypercore-persistence", "hypercore-chain/persistence"]
indexer = ["hypercore-indexer"]
p2p = ["hypercore-chain/p2p", "libp2p"]

[dependencies]
# Workspace crates
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-chain = { workspace = true }
hypercore-evm = { workspace = true }
hypercore-gateway = { workspace = true }
hypercore-persistence = { workspace = true, optional = true }
hypercore-indexer = { workspace = true, optional = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Hex encoding
hex = { workspace = true }

# Performance (Phase E)
mimalloc = { workspace = true }
core_affinity = { workspace = true }

# Metrics (Phase 5)
prometheus = { workspace = true }

# HTTP (for metrics server)
axum = { workspace = true }

# Random (for mock price feed)
rand = "0.8"

# P2P (optional)
libp2p = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
