[package]
name = "hypercore-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hypercore"
path = "src/main.rs"

[dependencies]
# Workspace crates
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-chain = { workspace = true }
hypercore-evm = { workspace = true }
hypercore-gateway = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Random (for mock price feed)
rand = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
