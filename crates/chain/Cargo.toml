[package]
name = "hypercore-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cometbft = ["tendermint", "tendermint-abci", "tendermint-proto", "parking_lot", "sha2"]
persistence = ["hypercore-persistence"]
p2p = ["libp2p", "futures"]

[dependencies]
# Workspace dependencies
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-evm = { workspace = true }
hypercore-persistence = { workspace = true, optional = true }

# Lock-free mempool queue (Phase B3)
crossbeam-queue = "0.3"

# Async runtime
tokio = { workspace = true, features = ["sync", "time"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Cryptography
sha3 = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { version = "0.8" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Encoding
hex = "0.4"

# CometBFT ABCI (optional feature)
tendermint = { workspace = true, optional = true }
tendermint-abci = { workspace = true, optional = true }
tendermint-proto = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# P2P Networking (optional feature)
libp2p = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
criterion = { workspace = true }

[[bench]]
name = "block_production"
harness = false
