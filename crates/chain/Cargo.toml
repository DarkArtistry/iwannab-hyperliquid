[package]
name = "hypercore-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cometbft = ["tendermint", "tendermint-abci", "tendermint-proto", "parking_lot", "sha2"]
persistence = ["hypercore-persistence"]

[dependencies]
# Workspace dependencies
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-persistence = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "time"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Cryptography
sha3 = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# CometBFT ABCI (optional feature)
tendermint = { workspace = true, optional = true }
tendermint-abci = { workspace = true, optional = true }
tendermint-proto = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
