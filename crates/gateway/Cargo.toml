[package]
name = "hypercore-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hypercore-gateway"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-chain = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Rate limiting
governor = { workspace = true }
dashmap = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread", "macros", "signal"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Crypto and hex
alloy-primitives = { workspace = true }
hex = "0.4"
sha3 = { workspace = true }

# HTTP client (for CometBFT RPC broadcast in multi-node mode)
reqwest = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Parallel signature verification (Phase B2)
rayon = "1.8"

# SIMD JSON parsing (Phase C1, optional)
simd-json = { version = "0.13", optional = true }

# CLI
clap = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
simd-json = ["dep:simd-json"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "signature"
harness = false
