[package]
name = "hypercore-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hypercore-gateway"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
hypercore-primitives = { workspace = true }
hypercore-engine = { workspace = true }
hypercore-chain = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["net", "sync", "rt-multi-thread", "macros", "signal"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto and hex
alloy-primitives = { workspace = true }
hex = "0.4"
sha3 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
