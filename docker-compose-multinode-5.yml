      - ./infra/multinode/validator-1/config/genesis.json:/cometbft/config/genesis.json:ro
      - ./infra/multinode/validator-1/config/node_key.json:/cometbft/config/node_key.json:ro
      - ./infra/multinode/validator-1/config/priv_validator_key.json:/cometbft/config/priv_validator_key.json:ro
    command: start --proxy_app=tcp://node-1:26658
    depends_on:
      node-1:
        condition: service_healthy
      cometbft-0:
        condition: service_started
    networks:
      - hypercore-5v

