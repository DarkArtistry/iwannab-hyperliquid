# 5-Validator HyperCore Cluster Configuration
#
# Comprehensive multi-validator network for E2E testing:
# - 5 validators with BFT consensus (tolerates 1 Byzantine node)
# - Full transaction propagation and state sync verification
# - EVM + non-EVM transaction testing across all nodes
#
# Usage:
#   1. Generate configs: ./scripts/generate-multi-validator-genesis.sh 5
#   2. Start cluster: docker compose -f docker-compose-multinode-5.yml up -d
#   3. Run tests: ./scripts/e2e-multinode-full.sh
#
# Network topology:
#   cometbft-0 <---> cometbft-1 <---> cometbft-2 <---> cometbft-3 <---> cometbft-4
#       |               |               |               |               |
#     node-0          node-1          node-2          node-3          node-4
#
# Ports per validator (base + validator_id * 10):
#   - P2P:  26656, 26666, 26676, 26686, 26696
#   - RPC:  26657, 26667, 26677, 26687, 26697
#   - ABCI: 26658, 26668, 26678, 26688, 26698
#   - EVM:  8545,  8555,  8565,  8575,  8585
#   - HTTP: 3000,  3010,  3020,  3030,  3040

services:
  # ============================================================================
  # PostgreSQL (shared for all nodes in test environment)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hypercore-postgres-5v
    environment:
      POSTGRES_USER: hypercore
      POSTGRES_PASSWORD: hypercore
      POSTGRES_DB: hypercore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_5v:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypercore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hypercore-5v

  # ============================================================================
  # Validator 0
  # ============================================================================
  node-0:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: hypercore-5v-node-0
    command: ["start", "--enable-persistence"]
    restart: on-failure
    stop_grace_period: 15s
    ports:
      - "26658:26658"
      - "8545:8545"
      - "3000:3000"
    volumes:
      - node0_data:/data
    environment:
      RUST_LOG: info,hypercore=debug
      DATABASE_URL: postgres://hypercore:hypercore@postgres:5432/hypercore
      ABCI_ADDR: 0.0.0.0:26658
      EVM_RPC_ADDR: 0.0.0.0:8545
      HTTP_ADDR: 0.0.0.0:3000
      CONSENSUS_MODE: comet-bft
      COMETBFT_RPC_URL: http://cometbft-0:26657
      VALIDATOR_ID: "0"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hypercore-5v

  cometbft-0:
    image: cometbft/cometbft:v0.38.5
    container_name: hypercore-5v-cometbft-0
    restart: on-failure
    ports:
      - "26656:26656"
      - "26657:26657"
    volumes:
      - ./infra/multinode/validator-0/data:/cometbft/data
      - ./infra/multinode/validator-0/config/config.toml:/cometbft/config/config.toml:ro
      - ./infra/multinode/validator-0/config/genesis.json:/cometbft/config/genesis.json:ro
      - ./infra/multinode/validator-0/config/node_key.json:/cometbft/config/node_key.json:ro
      - ./infra/multinode/validator-0/config/priv_validator_key.json:/cometbft/config/priv_validator_key.json:ro
    command: start --proxy_app=tcp://node-0:26658
    depends_on:
      node-0:
        condition: service_healthy
    networks:
      - hypercore-5v

  # ============================================================================
  # Validator 1
  # ============================================================================
  node-1:
